site_name: Williams Warhammer Lore
site_description: "An unofficial living archive of Warhammer 40,000 armies, characters, relics, ships and tabletop campaigns."
site_url: https://rednecko.github.io/warhammer-archives/
repo_url: https://github.com/Rednecko/warhammer-archives
repo_name: Rednecko/warhammer-archives
edit_uri: ""
copyright: "Unofficial Warhammer 40,000 fan archive · Not affiliated with Games Workshop"
docs_dir: docs

theme:
  name: material
  language: en
  logo: assets/images/templar-sigil.svg
  favicon: assets/images/templar-sigil.svg
  palette:
    scheme: slate
    primary: custom
    accent: amber
  font:
    text: Inter
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - The Archive: index.md
  - Sons of Sigismund:
      - Overview: sons-of-sigismund/index.md
      - "1. Chapter Origins": sons-of-sigismund/history/founding.md
      - "2. Order Organisation":
          - "2.1 Founding muster": sons-of-sigismund/organization/founding-cadre.md
          - "2.2 Chain of command": sons-of-sigismund/organization/chain-of-command.md
          - "2.3 Membership and growth": sons-of-sigismund/organization/membership.md
      - "6. Combat Doctrine": sons-of-sigismund/doctrine/index.md
      - "7. Beliefs and Traditions":
          - "7.1 Traditions and Litany": sons-of-sigismund/traditions/index.md
          - "7.2 Heraldry": sons-of-sigismund/traditions/heraldry.md
      - "8. Notable Members":
          - "8.1 Founding Marshal": sons-of-sigismund/characters/founding-marshal.md
          - "8.2 Command household": sons-of-sigismund/characters/command-household.md
          - "8.3 Ten founding Sword Brethren": sons-of-sigismund/characters/sword-brethren.md
      - "9. Relics and Reliquary":
          - "9.1 Founding relics": sons-of-sigismund/relics/index.md
          - "9.2 Custodianship": sons-of-sigismund/relics/custodianship.md
      - "10. Fleet and Fortress-Monastery":
          - "10.1 The Righteous Crusader": sons-of-sigismund/fleet/righteous-crusader.md
          - "10.2 Deck-by-deck guide": sons-of-sigismund/fleet/deck-guide.md
          - "10.3 Movement and access": sons-of-sigismund/fleet/operational-routes.md
      - "14. Campaigns and Battles":
          - "14.1 Campaign chronicle": sons-of-sigismund/campaigns/index.md
          - "14.2 Armageddon theater": sons-of-sigismund/campaigns/armageddon.md
          - "14.3 Battle-report template": sons-of-sigismund/campaigns/battle-log-template.md
      - "16. Sources and Records":
          - "16.1 Continuity register": sons-of-sigismund/archive/canon-status.md
          - "16.2 Sources and editorial notes": sons-of-sigismund/archive/sources.md
  - Armies: armies/index.md
  - Lore Workshop:
      - Research library: research/index.md
      - Next subjects: research/next-topics.md
